<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llm-gallery visualizer</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="index">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="logo-badge">λ</span>
        llm-gallery
      </a>
      <nav class="header-actions">
        <a class="header-link" href="compare.html">Compare</a>
        <a class="header-link" href="https://github.com/pavelsimo/llm-gallery#readme">README</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </nav>
    </header>

    <main class="index-shell">
      <section class="hero">
        <p class="section-tag">§ llm-gallery / 83 architectures</p>
        <h1>Interactive <em>model-code</em> visualizer</h1>
        <p class="hero-lead">
          Every architecture in the gallery, drawn and annotated. Click a block in the diagram to
          jump straight to the PyTorch that implements it.
        </p>
      </section>

      <section class="toolbar" aria-label="Model filters">
        <label class="search-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Model, slug, or architecture" autocomplete="off" />
        </label>
        <label>
          <span>Tier</span>
          <select id="tierFilter">
            <option value="all">All tiers</option>
            <option value="1">Tier 1</option>
            <option value="2">Tier 2</option>
            <option value="3">Tier 3</option>
          </select>
        </label>
        <label>
          <span>Template</span>
          <select id="templateFilter">
            <option value="all">All templates</option>
          </select>
        </label>
      </section>

      <div class="result-meta" id="resultMeta"></div>
      <section class="learning-rail" id="learningRail" aria-label="Learning path"></section>
      <section class="model-grid" id="modelGrid" aria-live="polite"></section>
    </main>
  </body>
</html>
