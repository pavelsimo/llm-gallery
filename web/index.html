<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llm-gallery visualizer</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="index">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="logo-badge">λ</span>
        llm-gallery
      </a>
      <nav class="header-actions">
        <a class="header-link" href="compare.html">Compare</a>
        <a class="header-link" href="https://github.com/pavelsimo/llm-gallery">
          <svg
            class="header-link-icon"
            aria-hidden="true"
            focusable="false"
            width="18"
            height="18"
            viewBox="0 0 16 16"
            fill="currentColor"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          Repository
        </a>
      </nav>
    </header>

    <main class="index-shell">
      <section class="hero">
        <h1>Interactive <em>model-code</em> visualizer</h1>
        <p class="hero-attribution">
          Inspired by Sebastian Raschka&rsquo;s
          <a href="https://sebastianraschka.com/llm-architecture-gallery">LLM Architecture Gallery</a>.
        </p>
      </section>

      <section class="toolbar" aria-label="Model filters">
        <label class="search-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Model, slug, or architecture" autocomplete="off" />
        </label>
        <label>
          <span>Tier</span>
          <select id="tierFilter">
            <option value="all">All tiers</option>
            <option value="1">Tier 1</option>
            <option value="2">Tier 2</option>
            <option value="3">Tier 3</option>
          </select>
        </label>
        <label>
          <span>Template</span>
          <select id="templateFilter">
            <option value="all">All templates</option>
          </select>
        </label>
      </section>

      <div class="result-meta" id="resultMeta"></div>
      <section class="model-grid" id="modelGrid" aria-live="polite"></section>
    </main>
  </body>
</html>
