<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model viewer</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="viewer">
    <header class="viewer-header">
      <div class="header-actions">
        <a class="back-link" href="index.html">All models</a>
        <a class="header-link" id="compareLink" href="compare.html">Compare</a>
      </div>
      <div class="viewer-title">
        <p class="eyebrow" id="viewerSlug">Loading</p>
        <h1 id="viewerName">Model viewer</h1>
      </div>
      <div class="viewer-controls">
        <button class="nav-button" id="prevModel" type="button" title="Previous model ([)">Prev</button>
        <label class="model-jump">
          <span>Model</span>
          <select id="modelSelect"></select>
        </label>
        <button class="nav-button" id="nextModel" type="button" title="Next model (])">Next</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="viewer-shell">
      <aside class="diagram-pane" tabindex="0" aria-label="Diagram and model metadata">
        <div class="notice" id="viewerNotice" role="status" hidden></div>
        <div class="model-facts" id="modelFacts"></div>
        <section class="related-models" id="relatedModels" aria-label="Related models"></section>
        <div class="diagram-wrap" id="diagramWrap"></div>
        <nav class="section-nav" id="sectionNav" aria-label="Code sections"></nav>
      </aside>
      <section class="code-pane" aria-label="Source code">
        <div class="terminal-bar">
          <span class="dot r"></span>
          <span class="dot y"></span>
          <span class="dot g"></span>
          <span class="title" id="sourcePath"></span>
        </div>
        <div class="code-toolbar">
          <label class="code-search">
            <span>Search</span>
            <input id="codeSearch" type="search" placeholder="Find code" autocomplete="off" />
          </label>
          <div class="copy-actions" aria-label="Copy actions">
            <button type="button" id="copyActiveLink" title="Copy link to active block">Link</button>
            <button type="button" id="copySection" title="Copy active section code">Section</button>
            <button type="button" id="copyCode" title="Copy full source">Code</button>
          </div>
          <span id="activeRange" aria-live="polite"></span>
        </div>
        <pre class="code-block" tabindex="0"><code id="codeLines"></code></pre>
      </section>
    </main>
  </body>
</html>
