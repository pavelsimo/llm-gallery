<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model viewer</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="viewer">
    <header class="viewer-header">
      <div class="header-actions">
        <a class="back-link" href="index.html">All models</a>
        <a class="header-link" id="compareLink" href="compare.html">Compare</a>
      </div>
      <div class="viewer-title">
        <p class="eyebrow" id="viewerSlug">Loading</p>
        <h1 id="viewerName">Model viewer</h1>
      </div>
      <div class="viewer-controls">
        <button class="nav-button" id="prevModel" type="button" title="Previous model ([)">Prev</button>
        <label class="model-jump">
          <span>Model</span>
          <select id="modelSelect"></select>
        </label>
        <button class="nav-button" id="nextModel" type="button" title="Next model (])">Next</button>
      </div>
    </header>

    <main class="viewer-shell">
      <aside class="diagram-pane" tabindex="0" aria-label="Diagram and model metadata">
        <div class="notice" id="viewerNotice" role="status" hidden></div>
        <div class="model-facts" id="modelFacts"></div>
        <section class="related-models" id="relatedModels" aria-label="Related models"></section>
        <div class="diagram-wrap" id="diagramWrap"></div>
        <nav class="section-nav" id="sectionNav" aria-label="Code sections"></nav>
      </aside>
      <section class="code-pane" aria-label="Source code">
        <div class="terminal-bar">
          <span class="dot r"></span>
          <span class="dot y"></span>
          <span class="dot g"></span>
          <span class="title" id="sourcePath"></span>
        </div>
        <div class="viewer-tabs" role="tablist" aria-label="Model resources">
          <button
            class="viewer-tab active"
            id="codeTab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="codeTabPanel"
            data-viewer-tab="code"
          >
            Code
          </button>
          <button
            class="viewer-tab"
            id="reportTab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="reportTabPanel"
            data-viewer-tab="report"
          >
            Tech Report
          </button>
        </div>
        <div class="tab-panel code-tab-panel" id="codeTabPanel" role="tabpanel" aria-labelledby="codeTab">
          <div class="code-toolbar">
            <div class="copy-actions" aria-label="Copy actions">
              <button type="button" id="copyActiveLink" title="Copy link to active block">Link</button>
              <button type="button" id="copySection" title="Copy active section code">Section</button>
              <button type="button" id="copyCode" title="Copy full source">Code</button>
            </div>
            <span id="activeRange" aria-live="polite"></span>
          </div>
          <pre class="code-block" tabindex="0"><code id="codeLines"></code></pre>
        </div>
        <div class="tab-panel report-tab-panel" id="reportTabPanel" role="tabpanel" aria-labelledby="reportTab" hidden>
          <iframe id="reportFrame" title="Tech report" loading="lazy"></iframe>
          <div class="report-fallback" id="reportFallback" hidden>
            <p id="reportFallbackText"></p>
            <a id="reportOpenLink" href="#" target="_blank" rel="noreferrer">Open report</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
