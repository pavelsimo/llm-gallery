<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compare models</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="compare">
    <header class="viewer-header">
      <div class="header-actions">
        <a class="back-link" href="index.html">All models</a>
      </div>
      <div class="viewer-title">
        <p class="eyebrow">llm-gallery</p>
        <h1>Compare models</h1>
      </div>
      <div class="viewer-controls">
        <label class="model-jump">
          <span>Left</span>
          <select id="leftModelSelect"></select>
        </label>
        <label class="model-jump">
          <span>Right</span>
          <select id="rightModelSelect"></select>
        </label>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="compare-shell">
      <section class="compare-panels" aria-label="Selected models">
        <article class="compare-panel">
          <div class="compare-panel-head">
            <h2 id="leftModelName">Left model</h2>
            <a id="leftViewerLink" href="viewer.html">Open</a>
          </div>
          <div class="model-facts" id="leftModelFacts"></div>
          <div class="diagram-wrap compare-diagram" id="leftDiagramWrap"></div>
        </article>
        <article class="compare-panel">
          <div class="compare-panel-head">
            <h2 id="rightModelName">Right model</h2>
            <a id="rightViewerLink" href="viewer.html">Open</a>
          </div>
          <div class="model-facts" id="rightModelFacts"></div>
          <div class="diagram-wrap compare-diagram" id="rightDiagramWrap"></div>
        </article>
      </section>

      <section class="config-diff-section" aria-label="Configuration differences">
        <h2>Config diff</h2>
        <div class="config-diff-wrap" tabindex="0">
          <table class="config-diff" id="configDiffTable"></table>
        </div>
      </section>
    </main>
  </body>
</html>
